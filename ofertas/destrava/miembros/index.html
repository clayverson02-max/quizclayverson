<style>
/* Layout: columna única tipo app, mapa del cuerpo como portada, tarjetas de módulo en grilla que se apila en móvil */
:root{
 --bg:#f6f4ef; --surface:#ffffff; --ink:#15302f; --muted:#5b6e6c; --line:#dfe3df;
 --brand:#0f4c5c; --aqua:#2ec4b6; --aqua-soft:#d8f3ef; --orange:#f28c28; --on-brand:#ffffff;
 --body-fill:#e6ece9; --body-stroke:#9fb3b0;

 --text:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0d1d20; --surface:#132a2e; --ink:#e6f0ee; --muted:#9ab0ad; --line:#24403f;
 --brand:#7fd3d9; --aqua:#2ec4b6; --aqua-soft:#16403d; --orange:#f5a04a; --on-brand:#0d1d20;
 --body-fill:#1d3a3e; --body-stroke:#3f6a6a; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d1d20; --surface:#132a2e; --ink:#e6f0ee; --muted:#9ab0ad; --line:#24403f;
 --brand:#7fd3d9; --aqua:#2ec4b6; --aqua-soft:#16403d; --orange:#f5a04a; --on-brand:#0d1d20;
 --body-fill:#1d3a3e; --body-stroke:#3f6a6a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:22px;color:var(--brand);letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0}
.logo span{color:var(--aqua)}
.search{flex:1;min-width:0}
.search input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.search input:focus,button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(28px,6vw,40px);letter-spacing:-.02em}
h2{font-size:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
section{display:flex;flex-direction:column;gap:14px;padding-block:22px}
.hero{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero svg{max-width:240px;margin:0 auto}}
.hero p{color:var(--muted);margin:0;max-width:44ch}
.bodymap{width:100%;height:auto}
.bodymap .zone{fill:var(--body-fill);stroke:var(--body-stroke);stroke-width:1.5;cursor:pointer;transition:fill .2s}
.bodymap .zone:hover,.bodymap .zone:focus{fill:var(--aqua);outline:none}
.bodymap text{font-size:9px;fill:var(--muted);font-family:var(--text);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--aqua)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.mod:hover{border-color:var(--aqua)}
.mod .n{font-family:var(--display);font-size:15px;color:var(--brand);font-weight:700}
.mod .t{font-family:var(--display);font-size:19px;font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--aqua)}
.small{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--aqua-soft)}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand);min-width:34px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:var(--on-brand)}
.tick.on{background:var(--aqua);border-color:var(--aqua)}
.back{background:none;border:0;color:var(--brand);font:inherit;font-weight:700;padding:0;cursor:pointer;align-self:flex-start}
.ex{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
@media (max-width:620px){.ex{grid-template-columns:1fr}}
.video{aspect-ratio:9/16;max-width:100%;width:100%;max-height:460px;border-radius:16px;background:linear-gradient(160deg,#0f4c5c,#12313a);position:relative;overflow:hidden;color:#fff;justify-self:center}
.video svg{position:absolute;inset:0;width:100%;height:100%}
.video .badge{position:absolute;top:12px;right:12px;background:#f28c28;color:#fff;font-weight:700;border-radius:8px;padding:4px 9px;font-size:14px}
.video .soon{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--display);font-size:18px;font-weight:700}
.video.anim{aspect-ratio:6/5;max-height:none}
.video.anim .soon{top:14px;bottom:auto;left:14px;right:70px;text-align:left}
.steps li.cur{background:rgba(46,196,182,.14);border-radius:10px}
.steps li{transition:background .3s;padding:4px 6px}
.video .soon small{display:block;font-family:var(--text);font-weight:400;font-size:12px;opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--aqua-soft);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps .s{flex:none;background:var(--orange);color:#fff;font-weight:700;font-size:12px;border-radius:7px;padding:3px 7px;margin-top:2px;font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.timer{font-family:var(--display);font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand);line-height:1}
.warn{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
.cur{border-left:4px solid var(--aqua);background:var(--aqua-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.dls{display:grid;gap:10px}.dl{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-decoration:none}
.dl b{display:block}.dl small{display:block;color:var(--muted)}.dli{flex:none;width:46px;height:46px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.dla{margin-left:auto;font-weight:700;color:var(--brand);white-space:nowrap}
.wa{border-radius:18px;padding:16px;background:var(--aqua-soft)}.wab{display:inline-block;margin-top:6px;background:#25d366;color:#fff;font-weight:700;padding:12px 18px;border-radius:999px;text-decoration:none}.wan{font-size:14px;color:var(--muted)}
</style>

<script>

(function(){
const L=(a,b,k)=>a+(b-a)*k, P=(a,b,k)=>[L(a[0],b[0],k),L(a[1],b[1],k)];

const LUNGE={view:'side',H:[114,50],N:[112,70],Hp:[112,128],E1:[130,100],W1:[150,136],E2:[126,100],W2:[146,134],K1:[160,140],F1:[166,182],K2:[96,182],F2:[56,182]};
const STAND={view:'side',H:[120,30],N:[120,50],Hp:[120,112],E1:[122,82],W1:[125,112],E2:[118,82],W2:[116,112],K1:[123,147],F1:[124,182],K2:[117,147],F2:[116,182]};
const LONG={view:'side',H:[96,96],N:[93,114],Hp:[90,172],E1:[108,144],W1:[128,168],E2:[104,142],W2:[124,166],K1:[140,175],F1:[192,176],K2:[138,177],F2:[190,178]};
const KNEEL={view:'side',H:[60,128],N:[80,138],Hp:[150,150],E1:[76,160],W1:[72,182],E2:[84,160],W2:[80,182],K1:[160,182],F1:[200,182],K2:[166,182],F2:[206,182]};
// ---------- moldes (k = 0..1..0 suavizado, t = tempo em s) ----------
const T={
 nod:(k)=>({...SEAT_S,H:P(SEAT_S.H,[120,104],k)}),
 tuck:(k)=>({...SEAT_S,H:P(SEAT_S.H,[98,94],k)}),
 tilt:(k,t)=>({...SEAT_F,H:[120+14*Math.sin(t*1.6),90+3*Math.abs(Math.sin(t*1.6))]}),
 turn:(k,t)=>({...SEAT_F,H:[120+7*Math.sin(t*1.6),90],eye:7*Math.sin(t*1.6)}),
 shrug:(k)=>{const d=12*k;return {...SEAT_F,S1:[97,116-d],S2:[143,116-d],E1:[90,145-d],E2:[150,145-d]}},
 circles:(k,t)=>{const a=t*2.4,x=5*Math.cos(a),y=6*Math.sin(a);return {...SEAT_F,S1:[97+x,116+y],S2:[143-x,116+y],E1:[90+x,145+y],E2:[150-x,145+y]}},
 armcross:(k)=>({...SEAT_F,E2:P(SEAT_F.E2,[136,124],k),W2:P(SEAT_F.W2,[96,118],k),E1:P(SEAT_F.E1,[110,124],k),W1:P(SEAT_F.W1,[132,120],k)}),
 overhead:(k)=>({...SEAT_F,E1:P(SEAT_F.E1,[94,74],k),W1:P(SEAT_F.W1,[106,44],k),E2:P(SEAT_F.E2,[146,74],k),W2:P(SEAT_F.W2,[134,44],k)}),
 sidebend:(k,t)=>{const s=Math.sin(t*1.4),A=T.overhead(1),ang=.28*s,c=Math.cos(ang),sn=Math.sin(ang),o=[120,168];const r=p=>[o[0]+(p[0]-o[0])*c-(p[1]-o[1])*sn,o[1]+(p[0]-o[0])*sn+(p[1]-o[1])*c];
   for(const n of ['H','N','S1','S2','E1','W1','E2','W2'])A[n]=r(A[n]);return A},
 twist:(k,t)=>{const s=Math.sin(t*1.4),w=1-.55*Math.abs(s);return {...SEAT_F,S1:[120-23*w,116],S2:[120+23*w,116],H:[120+6*s,90],E1:[120-30*w+10*s,140],W1:[120-20*w+22*s,150],E2:[120+30*w+10*s,140],W2:[120+20*w+22*s,150]}},
 wrist:(k,t)=>{const a=t*3,x=5*Math.cos(a),y=5*Math.sin(a);return {...SEAT_F,E1:[96,142],W1:[108+x,124+y],E2:[144,142],W2:[132-x,124+y],hand:3+2*Math.abs(Math.sin(t*2))}},
 breath:(k)=>({...SEAT_F,S1:[95-3*k,116-2*k],S2:[145+3*k,116-2*k],glow:k}),
 butterfly:(k,t)=>{const d=10*Math.sin(t*4);return {...SEAT_F,K1:[72,160+d],K2:[168,160+d],F1:[114,178],F2:[126,178]}},

 rock:(k)=>mix(QUAD,{view:'side',H:[60,128],N:[86,132],M:[130,134],Hp:[178,140],E1:[76,158],W1:[70,182],E2:[84,158],W2:[78,182],K1:[160,182],F1:[205,182],K2:[168,182],F2:[212,182]},k),

 plank:(k)=>({...QUAD,Hp:[160,L(128,132,k)],M:[118,L(128,131,k)],glow:k}),
 pigeon:(k)=>mix(QUAD,{view:'side',H:[56,134],N:[80,142],M:[120,150],Hp:[160,158],E1:[76,162],W1:[70,182],E2:[84,162],W2:[78,182],K1:[150,176],F1:[118,180],K2:[190,178],F2:[232,180]},k),
 cobra:(k)=>({...PRONE,N:P(PRONE.N,[88,138],k),H:P(PRONE.H,[72,120],k),E1:P(PRONE.E1,[90,160],k),W1:P(PRONE.W1,[86,180],k),E2:P(PRONE.E2,[94,162],k),W2:P(PRONE.W2,[90,181],k)}),
 sphinx:(k)=>({...PRONE,N:P(PRONE.N,[86,150],k),H:P(PRONE.H,[70,134],k),E1:P(PRONE.E1,[86,178],k),W1:P(PRONE.W1,[56,180],k),E2:P(PRONE.E2,[90,179],k),W2:P(PRONE.W2,[60,181],k)}),
 superman:(k)=>({...PRONE,H:P(PRONE.H,[52,156],k),E1:P(PRONE.E1,[52,164],k),W1:P(PRONE.W1,[28,152],k),E2:P(PRONE.E2,[56,166],k),W2:P(PRONE.W2,[32,154],k),K1:P(PRONE.K1,[178,168],k),F1:P(PRONE.F1,[214,154],k),K2:P(PRONE.K2,[180,170],k),F2:P(PRONE.F2,[216,156],k)}),
 arms_prone:(k)=>({...PRONE,H:P(PRONE.H,[52,160],k),E1:P(PRONE.E1,[50,162],k),W1:P(PRONE.W1,[28,150],k),E2:P(PRONE.E2,[56,165],k),W2:P(PRONE.W2,[32,153],k)}),
 pbreath:(k)=>({...PRONE,glow:k}),
 bridge:(k)=>({...SUP,Hp:P(SUP.Hp,[130,138],k),K1:P(SUP.K1,[162,128],k),K2:P(SUP.K2,[166,130],k)}),

 kneechest:(k)=>({...SUP,K1:P(SUP.K1,[104,126],k),F1:P(SUP.F1,[132,120],k),K2:P(SUP.K2,[108,128],k),F2:P(SUP.F2,[136,122],k),E1:P(SUP.E1,[84,150],k),W1:P(SUP.W1,[106,128],k)}),
 oneknee:(k)=>({...SUP,K1:P(SUP.K1,[104,126],k),F1:P(SUP.F1,[132,120],k),E1:P(SUP.E1,[84,150],k),W1:P(SUP.W1,[106,128],k)}),
 wiper:(k,t)=>{const s=Math.sin(t*1.5);return {...SUP,K1:[160-4*Math.abs(s),138+28*Math.abs(s)],K2:[164-4*Math.abs(s),140+28*Math.abs(s)],tw:s}},
 legraise:(k)=>({...SUP,K1:P(SUP.K1,[136,112],k),F1:P(SUP.F1,[142,62],k)}),

 march:(k,t)=>{const a=(Math.sin(t*2)+1)/2;return {...SUP,K1:P(SUP.K1,[120,118],a),F1:P(SUP.F1,[150,124],a),K2:P(SUP.K2,[120,118],1-a),F2:P(SUP.F2,[150,124],1-a)}},
 deadbug:(k,t)=>{const a=(Math.sin(t*1.6)+1)/2;return {...SUP,K1:[118,120],F1:P([146,122],[176,150],a),K2:[122,122],F2:[150,124],E1:[74,140],W1:P([80,108],[40,160],1-a),E2:[78,140],W2:P([84,108],[44,160],a)}},
 angels:(k)=>({...SUP,E1:P(SUP.E1,[50,176],k),W1:P(SUP.W1,[18,170],k)}),
 happybaby:(k)=>({...SUP,K1:P(SUP.K1,[98,140],k),F1:P(SUP.F1,[106,96],k),E1:P(SUP.E1,[84,130],k),W1:P(SUP.W1,[104,100],k)}),
 legsup:(k)=>({...SUP,K1:P(SUP.K1,[132,110],k),F1:P(SUP.F1,[136,60],k),K2:P(SUP.K2,[134,112],k),F2:P(SUP.F2,[138,62],k)}),
 sbreath:(k)=>({...SUP,glow:k}),
 ankle:(k,t)=>({...LONG,F1:[192+5*Math.cos(t*3),170+5*Math.sin(t*3)]}),
 anklepump:(k)=>({...SUP,K1:[140,176],F1:P([186,166],[192,178],k),K2:[142,178],F2:[188,178]}),
 longfold:(k)=>({...LONG,N:P(LONG.N,[140,140],k),H:P(LONG.H,[158,140],k),E1:P(LONG.E1,[162,160],k),W1:P(LONG.W1,[186,170],k),E2:P(LONG.E2,[158,158],k),W2:P(LONG.W2,[182,168],k)}),
 book:(k)=>{const a=Math.PI*(1-k);return {...SIDE,E1:[64+22*Math.cos(a),165-22*Math.sin(a)],W1:[64+44*Math.cos(a),165-44*Math.sin(a)]}},

function seg(pts,w,col){return `<path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`}
function draw(p){

 } else {
  const far=(a,b,c)=>seg([a,b,c],10,C.far);
  s+=far(p.N,p.E2,p.W2)+seg([p.Hp,p.K2,p.F2],12,C.far);

 }

}
const CYCLE=4.2; // segundos por repetição
function frame(now){
 const t=now/1000;
 document.querySelectorAll('.anim[data-anim]').forEach(el=>{
  const n=+el.dataset.anim, tp=tplFor(n), fn=T[tp]; if(!fn) return;
  const off=(+el.dataset.off||0), ph=((t+off)%CYCLE)/CYCLE, k=ease(ph<.5?ph*2:2-ph*2);
  const svg=el.querySelector('svg'); svg.innerHTML=draw(fn(k,t+off));
  const ol=el.closest('.ex')&&el.closest('.ex').querySelector('ol.steps'), lis=ol?ol.querySelectorAll('li').length:3, ns=Math.max(1,Math.min(lis,6)), st=Math.min(ns,Math.floor(((t+off)%(CYCLE*ns))/CYCLE)+1), b=el.querySelector('.badge'); if(b) b.textContent=st+'/'+ns;
  if(ol&&!el.dataset.rot){ ol.querySelectorAll('li').forEach((li,i)=>li.classList.toggle('cur',i===st-1)); }
 });
 requestAnimationFrame(frame);
}
window.DestrabaAnim={box(n,rot){return `<div class="video anim" data-anim="${n}"${rot?' data-rot="1"':''} role="img" aria-label="Demostración animada del ejercicio"><svg viewBox="0 0 240 200" preserveAspectRatio="xMidYMid meet"></svg><span class="badge">1/3</span><div class="soon"><small>Demostración del movimiento · sigue el paso a paso</small></div></div>`},tplFor,T,draw};
if(!window.matchMedia||!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
else { const once=()=>{document.querySelectorAll('.anim[data-anim]').forEach(el=>{el.querySelector('svg').innerHTML=draw(T[tplFor(+el.dataset.anim)](1,0));});}; setInterval(once,500); }
})();

 app.querySelectorAll(".zone").forEach(z=>{z.onclick=()=>go(()=>showMod(z.dataset.zone));z.onkeydown=ev=>{if(ev.key==="Enter")go(()=>showMod(z.dataset.zone))}});

function showMod(m){
 const it=E.filter(e=>e.region===m), idx=MODS.findIndex(x=>x[0]===m), d=it.filter(e=>done.has(e.numero)).length;
 app.innerHTML=`<section><button class="back" data-home>← Inicio</button><span class="eyebrow">Módulo ${idx+1} · ${d}/${it.length} hechos</span><h1>${esc(MODS[idx][1])}</h1><div class="bar"><i style="width:${d/it.length*100}%"></i></div><div class="list">${it.map(row).join("")}</div></section>`;
 bind();
}

 return `<div class="video" role="img" aria-label="Espacio del video, próximamente"><svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice">
  <rect x="15" y="40" width="60" height="110" rx="4" fill="#2ec4b6" opacity=".25"/>

  <path d="M55 62 l6 -4 M56 70 l7 0 M55 78 l6 4" stroke="#f28c28" stroke-width="1.3" stroke-linecap="round"/>
 </svg><span class="badge">${step}/${total}</span><div class="soon">Video próximamente<small>Mientras tanto, sigue el paso a paso</small></div></div>`;

function showEx(n){
 const e=E.find(x=>x.numero===n), total=e.pasos.length, idx=MODS.findIndex(x=>x[0]===e.region);
 const isR = !!e.ejercicios;
 app.innerHTML=`<section><button class="back" data-mod="${esc(e.region)}">← ${esc(MODS[idx][1])}</button>
 <div class="ex">${DestrabaAnim.box(isR?e.ejercicios[0]:e.numero,isR)}
 <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
  <span class="eyebrow">Ejercicio #${e.numero} · ${esc(e.region)}</span><h1>${esc(e.nombre)}</h1>
  <div class="meta"><span class="pill">⏱ ${esc(e.tiempo)}</span><span class="pill">Nivel ${esc(e.nivel)}</span></div>
  <p style="margin:0"><b>Objetivo:</b> ${esc(e.objetivo)}</p>
  <div class="box"><b>Posición inicial</b><br>${esc(e.posicionInicial)}</div>
  <ol class="steps">${(isR?e.ejercicios.map(id=>{const x=E.find(y=>y.numero===id);return `<button class="row" style="padding:6px 0" data-ex="${id}">${esc(x.nombre)} <span class="small">· 90 s</span></button>`}):e.pasos.map(esc)).map((p,i,a)=>`<li><span class="s">${i+1}/${a.length}</span><span>${p}</span></li>`).join("")}</ol>

  <div class="actions">

   <button class="btn ${isR?'ghost':''}" id="done">${done.has(n)?'✓ Hecho':'Marcar como hecho'}</button>
   <button class="btn ghost" id="fav">${favs.has(n)?'★ En favoritos':'☆ Favorito'}</button>
  </div>
 </div></div></section>`;
 document.getElementById("done").onclick=()=>{done.has(n)?done.delete(n):done.add(n);save("destraba_done",[...done]);showEx(n)};
 document.getElementById("fav").onclick=()=>{favs.has(n)?favs.delete(n):favs.add(n);save("destraba_favs",[...favs]);showEx(n)};
 if(isR) document.getElementById("start").onclick=()=>go(()=>runRoutine(e,0));
 bind();
}
function runRoutine(r,i,left=90,paused=false){
 const ids=r.ejercicios, x=E.find(y=>y.numero===ids[i]);
 app.innerHTML=`<section><button class="back" data-ex="${r.numero}">← ${esc(r.nombre)}</button>
 <span class="eyebrow">Ejercicio ${i+1} de ${ids.length}</span>
 <div class="ex">${DestrabaAnim.box(x.numero)}<div style="display:flex;flex-direction:column;gap:14px;min-width:0">
 <h1>${esc(x.nombre)}</h1><div class="timer" id="t">${fmt(left)}</div>
 <ol class="steps">${x.pasos.map((p,k,a)=>`<li><span class="s">${k+1}/${a.length}</span><span>${esc(p)}</span></li>`).join("")}</ol>
 <div class="actions"><button class="btn" id="pp">${paused?'▶ Seguir':'❚❚ Pausa'}</button><button class="btn ghost" id="nx">${i<ids.length-1?'Siguiente →':'Terminar'}</button></div>
 <div class="list">${ids.map((id,k)=>`<div class="row ${k===i?'cur':''}" style="cursor:default"><span class="num">${k+1}</span><span class="nm">${esc(E.find(y=>y.numero===id).nombre)}</span></div>`).join("")}</div>
 </div></div></section>`;
 bind();
 let t=left, p=paused;
 const next=()=>{stopTimer(); if(i<ids.length-1) runRoutine(r,i+1); else finish(r);};
 document.getElementById("nx").onclick=next;
 document.getElementById("pp").onclick=()=>{p=!p;document.getElementById("pp").textContent=p?'▶ Seguir':'❚❚ Pausa'};
 stopTimer();
 timerInt=setInterval(()=>{if(p)return;t--;const el=document.getElementById("t");if(el)el.textContent=fmt(t);if(t<=0)next();},1000);
}
function finish(r){ done.add(r.numero); r.ejercicios.forEach(id=>done.add(id)); save("destraba_done",[...done]);
 app.innerHTML=`<section><span class="eyebrow">Rutina completa</span><h1>¡Listo! 10 minutos para tu cuerpo.</h1><p>Marcamos la rutina y sus ejercicios como hechos. Bebe agua y nota cómo se siente tu espalda ahora.</p><div class="actions"><button class="btn" data-home>Volver al inicio</button></div></section>`; bind(); }
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function norm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function search(q){
 const nq=norm(q.trim()); if(!nq){go(home);return}
 const res=E.filter(e=>norm([e.nombre,e.region,e.objetivo,e.pasos.join(" ")].join(" ")).includes(nq));
 stopTimer();
 app.innerHTML=`<section><button class="back" data-home>← Inicio</button><span class="eyebrow">${res.length} resultados</span><h1>“${esc(q)}”</h1><div class="list">${res.map(row).join("")||'<p class="small">Sin resultados. Prueba con “cuello”, “lumbar” o “cadera”.</p>'}</div></section>`;
 bind();
}
function showFavs(){
 const res=E.filter(e=>favs.has(e.numero));
 app.innerHTML=`<section><button class="back" data-home>← Inicio</button><span class="eyebrow">Tus favoritos</span><h1>Favoritos</h1><div class="list">${res.map(row).join("")||'<p class="small">Aún no tienes favoritos. Abre un ejercicio y toca “☆ Favorito” para guardarlo aquí.</p>'}</div></section>`;
 bind();
}
document.getElementById("q").addEventListener("input",ev=>search(ev.target.value));
document.getElementById("home-btn").onclick=()=>{document.getElementById("q").value="";go(home)};
document.getElementById("fav-btn").onclick=()=>go(showFavs);
home();
</script>
