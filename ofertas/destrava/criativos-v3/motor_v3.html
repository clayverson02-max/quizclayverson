<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f4ef;--ink:#15302f;--muted:#5b6e6c;--line:#dfe3df;--brand:#0f4c5c;--aqua:#2ec4b6;--aqsoft:#d8f3ef;--coral:#ff7a59;--wa:#25d366}

.sc{position:absolute;inset:0;overflow:hidden;visibility:hidden;will-change:transform}
.L{background:radial-gradient(120% 80% at 50% 18%,#ffffff 0%,#f6f4ef 62%,#ece8df 100%)}

.bon{position:absolute;left:100px;right:100px;height:200px;border-radius:34px;background:#fff;box-shadow:0 24px 60px rgba(15,76,92,.16);display:flex;align-items:center;gap:30px;padding:0 34px;opacity:0}

.bon .k{margin-left:auto;font-size:22px;font-weight:800;color:var(--coral);letter-spacing:.1em}
.mini{position:absolute;width:250px;height:300px;border-radius:26px;background:#fff;box-shadow:0 16px 40px rgba(15,76,92,.16);overflow:hidden}
.mini img{width:100%;height:170px;object-fit:contain;background:#fff;border-bottom:1.5px solid var(--line)}

.mini span{display:block;padding:4px 16px;font-size:16px;color:var(--muted);font-weight:600}
.mini .bd{position:absolute;top:10px;right:10px;background:var(--coral);color:#fff;font-weight:800;border-radius:8px;padding:3px 9px;font-size:15px}
