<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f4ef;--ink:#15302f;--muted:#5b6e6c;--line:#dfe3df;--brand:#0f4c5c;--aqua:#2ec4b6;--aqsoft:#d8f3ef;--coral:#ff7a59;--wa:#25d366}

.mini{position:absolute;width:250px;height:300px;border-radius:26px;background:#fff;box-shadow:0 16px 40px rgba(15,76,92,.16);overflow:hidden}

.mini span{display:block;padding:4px 16px;font-size:16px;color:var(--muted);font-weight:600}
.mini .bd{position:absolute;top:10px;right:10px;background:var(--coral);color:#fff;font-weight:800;border-radius:8px;padding:3px 9px;font-size:15px}
</style></head><body>

{ let ch=0,cnt=0,prev=-1; CW.forEach((x,k)=>{ if(x.line!==prev||cnt>=4||(cnt>=2&&/[.,:]$/.test(CW[k-1]?.w||''))){ch++;cnt=0;prev=x.line;} x.chunk=ch; cnt++; }); }
function caption(t){ const cur=CW.find(x=>t>=x.s-.05&&t<x.e+.2)||CW.filter(x=>x.e<=t&&t-x.e<.3).pop(); const box=$('cap'); if(!cur){box.style.opacity=0;return;} box.style.opacity=1; const ws=CW.filter(x=>x.chunk===cur.chunk);
  $('capin').innerHTML=ws.map(x=>`<span class="${t>=x.s&&t<x.e?'on':(t>=x.e?'':'fut')}">${x.w.replace(/[.,:]$/,'')}</span>`).join(''); const k=eo(cl((t-ws[0].s+.05)/.15)); box.style.transform=`translateY(${(1-k)*20}px) scale(${.92+.08*k})`; }
window.setT=t=>{
  SC.forEach(([id,tp,fn],i)=>{ const a=NS[i], b=a+NL[i]; const el=$(id); const vis=t>=a-TR&&t<b+TR; el.style.visibility=vis?'visible':'hidden'; if(!vis) return;
    let tf='none',op=1,clip='none',fl='none';
    // entering
    if(i>0&&t<a+TR){ const p=eio(pr(t,a-TR,2*TR));
      if(tp==='mask'){ clip=`circle(${p*80}% at 50% 55%)`; }
      else if(tp==='whip'){ tf=`translateX(${(1-p)*110}%) skewX(${-(1-p)*8}deg)`; fl=`blur(${(1-p)*24}px)`; }
      else if(tp==='up'){ tf=`translateY(${(1-p)*100}%)`; fl=`blur(${(1-p)*18}px)`; }
      else if(tp==='zoom'){ tf=`scale(${lerp(1.5,1,p)})`; op=p; fl=`blur(${(1-p)*16}px)`; } }
    // leaving
    if(i<SC.length-1&&t>b-TR){ const p=eio(pr(t,b-TR,2*TR)); const nt=SC[i+1][1];
      if(nt==='mask'){ tf=`scale(${1-.1*p})`; }
      else if(nt==='whip'){ tf=`translateX(${-p*110}%) skewX(${-p*8}deg)`; fl=`blur(${p*24}px)`; }
      else if(nt==='up'){ tf=`translateY(${-p*60}%) scale(${1-.1*p})`; fl=`blur(${p*18}px)`; }
      else if(nt==='zoom'){ tf=`scale(${1-.4*p})`; op=1-p; } }
    el.style.transform=tf; el.style.opacity=op; el.style.clipPath=clip; el.style.filter=fl; el.style.zIndex=i;
    fn(t-a);
  });
  // flash/streak
  let fo=0, so=-1;
  SC.forEach(([id,tp],i)=>{ if(!i) return; const a=NS[i]; if(tp==='zoom'){ const p=pr(t,a-.12,.32); if(p>0&&p<1) fo=Math.max(fo,(p<.4?p/.4:1-(p-.4)/.6)*.85); } if(tp==='whip'||tp==='up'){ const p=pr(t,a-.3,.55); if(p>0&&p<1) so=p; } });
  S('flash',{opacity:fo}); S('streak',{opacity:so<0?0:(so<.3?so/.3:1-(so-.3)/.7)*.9,left:(so<0?-400:lerp(-400,1300,so))+'px'});
  caption(t);
};
