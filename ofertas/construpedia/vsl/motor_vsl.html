<div class="seal" style="position:absolute;right:${V?8:10}%;top:${V?14:12}%;width:calc(var(--u)*${V?20:18});height:calc(var(--u)*${V?20:18});border-radius:50%;background:#f26a1b;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font:900 calc(var(--u)*5) 'Inter Display';box-shadow:0 0 0 calc(var(--u)*.8) #fff inset">7<span style="font-size:.32em;letter-spacing:.1em">DÍAS</span><span style="font-size:.26em">GARANTÍA</span></div>`);
// 17 CTA
sc[17]=mk('bg-blue',`<div class="grid"></div><div class="c" style="width:90%;text-align:center;top:${V?40:42}%"><div class="h wh" style="font-size:calc(var(--u)*${V?9:8})">CONSTRU<span class="or">PEDIA</span></div><div style="color:#cfe0ff;font:600 calc(var(--u)*2.8) Inter;margin:calc(var(--u)*1) 0 calc(var(--u)*4)">La biblioteca visual de la construcción</div>
<div class="btn" style="display:inline-block;background:#f26a1b;color:#fff;font:900 calc(var(--u)*4.4) 'Inter Display';padding:calc(var(--u)*2) calc(var(--u)*5);border-radius:999px">Toca el botón de abajo</div><div class="arr" style="font:900 calc(var(--u)*9) Inter;color:#ffb21e;margin-top:calc(var(--u)*1)">↓</div></div>`);
// grain
const g=document.getElementById('grain');g.width=256;g.height=256;const gx=g.getContext('2d');const id=gx.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gx.putImageData(id,0,0);g.style.width=W*2+'px';g.style.height=H*2+'px';g.style.imageRendering='pixelated';
// captions
const cap=document.getElementById('cap');cap.style.bottom=(V?17:7)+'%';
function caption(t){const L=TL.find(l=>t>=l.vs-0.05&&t<l.vs+l.vd+0.35);if(!L||(L.i>=5&&L.i<=12)||L.i==17){cap.innerHTML='';return}
const ws=L.text.split(' ');const tot=ws.reduce((a,w)=>a+w.length+2,0);let acc=0,cur=0;const p=cl((t-L.vs)/L.vd)*tot;ws.forEach((w,i)=>{if(p>=acc)cur=i;acc+=w.length+2});
const ch=V?3:4;const st0=Math.floor(cur/ch)*ch;cap.innerHTML=ws.slice(st0,st0+ch).map((w,i)=>`<span class="${st0+i==cur?'on':''}">${w}</span>`).join('')}
// render
function wordsIn(el,lt,dur,sel='.w'){const ws=el.querySelectorAll(sel);ws.forEach((w,i)=>{const k=ob((lt-i*dur/ws.length)/0.28);w.style.opacity=cl(k*3);w.style.transform=`translateY(${(1-k)*40}%) scale(${0.6+0.4*k})`})}
const fl=document.getElementById('flash');
window.render=function(t){let k=TL.findIndex(l=>t>=l.s&&t<l.e);if(k<0)k=TL.length-1;const L=TL[k];const lt=t-L.s,D=L.e-L.s;
sc.forEach((s,i)=>s.style.display=i==k?'block':'none');const s=sc[k];
// transition in
const tin=oc(lt/0.3);const mode=k%4;let tr='';
if(k>0){if(mode==0)tr=`scale(${1.25-0.25*tin})`;else if(mode==1)tr=`translateX(${(1-tin)*30}%)`;else if(mode==2)tr=`translateY(${(1-tin)*25}%)`;else tr=`scale(${0.85+0.15*tin}) rotate(${(1-tin)*-3}deg)`}
const push=1+0.04*(lt/D);const sh=(k==0&&lt<0.4)||(k==2)?Math.sin(t*90)*U*0.4*(k==2?cl(1-lt/1.2):1):0;
s.style.transform=`${tr} scale(${push}) translate(${sh}px,${sh*0.6}px)`;s.style.filter=k>0&&lt<0.2&&mode==1?`blur(${(1-lt/0.2)*12}px)`:'none';
fl.style.opacity=(k>0&&(mode==0||k==4||k==16))?cl(0.7-lt/0.18):0;
const gr=s.querySelector('.grid');if(gr)gr.style.transform=`translate(${-lt*U*1.2}px,${-lt*U*.6}px)`;
if(k==0){wordsIn(s.querySelector('.hook'),lt,1.6);const q='cómo armar una zapata';const n=Math.floor(cl((lt-1.4)/1.4)*q.length);s.querySelector('.gtxt').textContent=q.slice(0,n);s.querySelector('.cur').style.opacity=Math.floor(t*3)%2;const gb=s.querySelector('.gbar');const kk=ob((lt-1.0)/0.4);gb.style.opacity=cl(kk);gb.style.transform=`translate(-50%,-50%) scale(${0.7+0.3*kk})`}
if(k==1){wordsIn(s.querySelector('.h'),lt,0.6);s.querySelectorAll('.bit').forEach((b,i)=>{const kk=ob((lt-0.15*i)/0.4);const ang=i*1.05+lt*0.5;const rx=V?28:34,ry=V?24:26;b.style.left=(50+Math.cos(ang)*rx)+'%';b.style.top=(56+Math.sin(ang*1.3)*ry)+'%';b.style.transform=`translate(-50%,-50%) rotate(${Math.sin(i+lt)*8}deg) scale(${kk})`;b.style.opacity=cl(kk)})}
if(k==2){wordsIn(s.querySelector('.big'),lt,0.5)}
if(k==3){const per=(L.vd)/3;s.querySelectorAll('.err').forEach((e,i)=>{const kk=ob((lt-0.1-i*per)/0.35);e.style.opacity=cl(kk);e.style.transform=`scale(${0.8+0.2*kk})`;const r=e.querySelector('.ring');const rk=oc((lt-0.4-i*per)/0.3);r.style.transform=`scale(${rk})`;r.style.opacity=rk})}
if(k==4){const lg=s.querySelector('.logo');const kk=ob((lt-0.1)/0.5);lg.style.transform=`scale(${0.5+0.5*kk})`;lg.style.opacity=cl(kk);const sb=s.querySelector('.sub');sb.style.opacity=cl((lt-0.6)/0.4);const lp=s.querySelector('.lap');const k2=oc((lt-1.2)/0.6);lp.style.transform=`translate(-50%,${-50+(1-k2)*40}%) perspective(1000px) rotateX(${(1-k2)*25}deg)`;lp.style.opacity=k2;lp.querySelectorAll('.tile').forEach((ti,i)=>{const k3=ob((lt-1.6-i*0.12)/0.3);ti.style.transform=`scale(${k3})`})}
if(k>=5&&k<=12){const a=s.querySelector('.aic');const kk=ob(lt/0.35);a.style.transform=`scale(${kk}) rotate(${(1-kk)*-20}deg)`;const h=s.querySelector('.h');h.style.transform=`translateY(${(1-oc((lt-0.08)/0.3))*60}%)`;h.style.opacity=cl((lt-0.05)/0.2)}
if(k==13){const pg=s.querySelector('.pg');const z=lt<2.2?1:1+0.9*io((lt-2.2)/1.2);const ox=lt<2.2?0:-14*io((lt-2.2)/1.2),oy=lt<2.2?0:16*io((lt-2.2)/1.2);const kk=oc(lt/0.5);pg.style.transform=`translate(-50%,-50%) translate(${ox}%,${oy}%) scale(${(0.85+0.15*kk)*z}) rotate(${(1-kk)*4}deg)`;
const sw=lt>4.4;pg.innerHTML=sw?(pg.dataset.v=='v'?pg.innerHTML:(pg.dataset.v='v',VIGA)):(pg.dataset.v=='z'?pg.innerHTML:(pg.dataset.v='z',ZAP));if(sw){pg.style.aspectRatio='1/1';pg.style.transform=`translate(-50%,-50%) scale(${(V?0.9:0.7)*(1+0.06*(lt-4.4))})`}else pg.style.aspectRatio='600/520'}
if(k==14){const per=L.vd/4.2;s.querySelectorAll('.bon').forEach((b,i)=>{const kk=ob((lt-0.1-i*per)/0.4);b.style.transform=`perspective(900px) rotateY(${(1-kk)*80}deg) scale(${0.8+0.2*kk})`;b.style.opacity=cl(kk*2)})}
if(k==15){['.d1','.d2','.d3'].forEach((q,i)=>{const d=s.querySelector(q);const kk=ob((lt-0.1-i*0.9)/0.45);d.style.transform=`translateY(${(1-kk)*60}%) scale(${0.8+0.2*kk})`;d.style.opacity=cl(kk*2)})}
if(k==16){const per=L.vd/3.3;s.querySelectorAll('.of').forEach((o,i)=>{const kk=ob((lt-0.05-i*per)/0.35);o.style.opacity=cl(kk);o.style.transform=`scale(${1.6-0.6*kk})`});const se=s.querySelector('.seal');const kk=ob((lt-2*per)/0.4);se.style.transform=`scale(${kk}) rotate(${(1-kk)*-90+Math.sin(lt*2)*4}deg)`}
if(k==17){const b=s.querySelector('.btn');b.style.transform=`scale(${1+0.05*Math.sin(lt*7)})`;s.querySelector('.arr').style.transform=`translateY(${Math.abs(Math.sin(lt*5))*U*2}px)`}
caption(t);
document.getElementById('grain').style.transform=`translate(${-(Math.floor(t*30)*37%256)}px,${-(Math.floor(t*30)*91%256)}px)`;
};
window.ready=true;
</script></body></html>
