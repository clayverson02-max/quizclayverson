<title>Painel da Loja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: coluna única pensada para celular. Topo com o dia e os números; depois a rotina com horários, ideias, relatórios e materiais. */
:root{--bg:#f3f5f8;--panel:#fff;--ink:#121820;--mute:#465160;--line:#dce2e9;--accent:#2f5bea;--accent-ink:#fff;--soft:#e7eefe;--ok:#14804a;--okbg:#e2f4ea;--warn:#a76300;--warnbg:#fdf1dc;
--d:"Sora",system-ui,sans-serif;--t:"Instrument Sans",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1218;--panel:#161d26;--ink:#e9eef4;--mute:#a7b2bf;--line:#2a3441;--accent:#7b97ff;--accent-ink:#0b1020;--soft:#1d2840;--ok:#4cc584;--okbg:#14301f;--warn:#f0b04a;--warnbg:#33260d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1218;--panel:#161d26;--ink:#e9eef4;--mute:#a7b2bf;--line:#2a3441;--accent:#7b97ff;--accent-ink:#0b1020;--soft:#1d2840;--ok:#4cc584;--okbg:#14301f;--warn:#f0b04a;--warnbg:#33260d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--t);-webkit-font-smoothing:antialiased}
.page{max-width:640px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--d);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px}h2{font-size:18px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero p{margin:0;opacity:.95}
.hero .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.hero .nums div{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px}
.hero .nums span{display:block;font-size:13px;font-weight:600;opacity:.9}
.hero .nums b{font:700 22px var(--m)}
.hero small{opacity:.85;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rot{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--bg)}
.step .h{font:700 16px var(--m);color:var(--accent)}
.step b{display:block}
.step p{margin:2px 0 0;color:var(--mute);font-size:15px}
.step.done{opacity:.55}
.step .txt{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{font:600 15px var(--t);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.it small{color:var(--mute)}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.met div{background:var(--bg);border-radius:8px;padding:6px 8px}.met span{display:block;font-size:12px;color:var(--mute)}.met b{font:700 15px var(--m)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.bub{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:15px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub.ai{align-self:flex-start;background:var(--bg)}
textarea{font:16px var(--t);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical}
.note{color:var(--mute);font-size:14px;margin:0}
.chip{font:600 13px var(--t);border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--accent)}
</style>

<div class="page" id="app"></div>

<script type="application/json" id="dados">
{"cliente":{"nome":"Sua loja","segmento":"Loja de roupas","responsavel":"","instagram":""},
 "gestor":{"nome":"Clayverson","whatsapp":""},
 "ia":{"nome":"Sua consultora","persona":"","conhecimento":"","foco":""},
 "hoje":{"data":"","saudacao":"Bom dia! Seu painel está sendo preparado pela equipe.","numeros":null,"rotina":[]},
 "ideias":[],"relatorios":[],"materiais":[]}
</script>

<script>
const D = JSON.parse(document.getElementById('dados').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = n => (Number(n)||0).toLocaleString('pt-BR');
const wa = (p,t) => { p=String(p||'').replace(/\D/g,''); return p ? 'https://wa.me/'+(p.length<=11?'55'+p:p)+'?text='+encodeURIComponent(t||'') : ''; };
const LSK = 'feito-'+(D.hoje.data||'');
let feitos = {}; try { feitos = JSON.parse(localStorage.getItem(LSK)||'{}'); } catch(e){}
const C = D.cliente, H = D.hoje, N = H.numeros;
let chatLog = [];

function render(){
  const gw = wa(D.gestor.whatsapp, 'Oi '+(D.gestor.nome||'')+', aqui é da '+C.nome+'. ');
  document.getElementById('app').innerHTML = `
  <div class="hero"><span class="chip" style="align-self:flex-start;background:rgba(255,255,255,.2);color:inherit">${esc(C.nome)}${H.data?' · '+esc(H.data):''}</span>
    <h1>${esc(H.saudacao)}</h1>
    ${N ? `<div class="nums"><div><span>Conversas hoje</span><b>${NUM(N.conversas)}</b></div><div><span>Seguidores novos</span><b>${NUM(N.seguidores)}</b></div>${N.custoConversa!=null?`<div><span>Custo por conversa</span><b>${BRL(N.custoConversa)}</b></div>`:''}</div><small>Números do anúncio${N.atualizadoEm?' atualizados às '+esc(N.atualizadoEm):''}</small>` : ''}
  </div>
  <div class="card"><h2>Sua rotina de hoje</h2>
    ${H.rotina.length ? `<div class="rot">${H.rotina.map((r,i) => `<div class="step ${feitos[i]?'done':''}"><div class="h">${esc(r.hora)}</div><div><b>${esc(r.acao)}</b>${r.detalhe?`<p>${esc(r.detalhe)}</p>`:''}${r.texto?`<div class="txt">${esc(r.texto)}</div>`:''}
      <div class="row">${r.texto?`<button class="btn" type="button" data-copy="${i}">Copiar texto</button>`:''}<button class="btn ${feitos[i]?'':'pri'}" type="button" data-feito="${i}">${feitos[i]?'✓ Feito':'Marcar como feito'}</button></div></div></div>`).join('')}</div>` : '<p class="note">A rotina do dia aparece aqui todas as manhãs.</p>'}
  </div>
  ${D.ideias.length ? `<div class="card"><h2>Ideias de conteúdo</h2><div class="list">${D.ideias.map(x => `<div class="it"><b>${esc(x.titulo)}</b><small>${esc(x.formato||'')}</small>${x.roteiro?`<p class="note" style="white-space:pre-wrap">${esc(x.roteiro)}</p>`:''}</div>`).join('')}</div></div>` : ''}
  <div class="card" id="assist"><h2>${esc(D.ia&&D.ia.nome||"Assistente da loja")}</h2><p class="note">${esc(D.ia&&D.ia.persona||"Sua consultora de vendas. Pergunte sobre atendimento, stories, grupo VIP e anúncios.")}</p><div id="assist-body"><p class="note">Carregando…</p></div></div>
  ${D.relatorios.length ? `<div class="card"><h2>Relatórios</h2><div class="list">${D.relatorios.map(x => `<div class="it"><b>${esc(x.periodo)}</b><div class="met"><div><span>Investido</span><b>${BRL(x.gasto)}</b></div><div><span>Conversas</span><b>${NUM(x.conversas)}</b></div><div><span>Custo/conv.</span><b>${BRL(x.custoConversa)}</b></div></div></div>`).join('')}</div></div>` : ''}
  ${D.materiais.length ? `<div class="card"><h2>Materiais da sua loja</h2><div class="list">${D.materiais.map(x => `<div class="it"><b>${esc(x.titulo)}</b>${x.resumo?`<small>${esc(x.resumo)}</small>`:''}${x.url?`<div class="row"><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir</a></div>`:''}</div>`).join('')}</div></div>` : ''}
  ${gw ? `<div class="card"><h2>Falar com seu gestor</h2><p class="note">${esc(D.gestor.nome)} acompanha seus anúncios.</p><div class="row"><a class="btn wa" href="${gw}" target="_blank" rel="noopener">Chamar no WhatsApp</a></div><p class="note">${esc(D.gestor.whatsapp)}</p></div>` : ''}`;
  setupAssist();
}

let sample = null, sampleTried = false;
async function setupAssist(){
  const el = document.getElementById('assist-body'); if (!el) return;
  if (!sampleTried){ sampleTried = true; sample = window.claude ? await window.claude.use('sample') : null; }
  if (!sample){ el.innerHTML = `<p class="note">Para conversar com o assistente, abra este painel com a sua conta do Claude. Enquanto isso, fale com o seu gestor pelo WhatsApp.</p>`; return; }
  el.innerHTML = `<div class="chat" id="chat">${chatLog.map(m => `<div class="bub ${m.role==='user'?'me':'ai'}">${esc(m.content)}</div>`).join('') || '<div class="bub ai">Oi! Sou ${esc((D.ia&&D.ia.nome)||'sua consultora')}. Me conta: como estão as vendas hoje? Te digo o próximo passo.</div>'}</div>
    <form id="askf"><textarea id="ask" rows="2" maxlength="800" placeholder="Ex.: o que posto hoje à tarde?" aria-label="Pergunta para o assistente"></textarea><div class="row"><button class="btn pri" type="submit">Perguntar</button></div></form>`;
  const ch = document.getElementById('chat'); ch.scrollTop = ch.scrollHeight;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'askf') return; e.preventDefault();
  const q = document.getElementById('ask').value.trim(); if (!q || !sample) return;
  chatLog.push({role:'user', content:q});
  const IA = D.ia||{};
  const ctx = 'Você é '+(IA.nome||'a consultora')+', consultora de vendas da loja "'+C.nome+'" ('+C.segmento+'), da assessoria de '+(D.gestor.nome||'')+'. '+(IA.persona||'')+' O que você sabe sobre o ramo e esta loja: '+(IA.conhecimento||'').slice(0,6000)+' Foco atual: '+(IA.foco||'')+'. Fale em português do Brasil, simples e direto, como um consultor próximo, com no máximo 6 linhas e sempre terminando com UMA ação concreta para fazer hoje. Dê estratégias práticas de atendimento no WhatsApp, follow-up, grupo VIP, stories e vitrine. Não prometa resultados, não invente números e não altere anúncios: para mudanças nos anúncios, diga para falar com o gestor. Dados de hoje: '+JSON.stringify({rotina:H.rotina, numeros:N, ideias:D.ideias.slice(0,3)});
  const msgs = [{role:'user', content: ctx + '\n\nConversa até agora:\n' + chatLog.slice(-8,-1).map(m => (m.role==='user'?'Lojista: ':'Assistente: ')+m.content).join('\n') + '\n\nPergunta do lojista: ' + q}];
  chatLog.push({role:'assistant', content:'Pensando…'}); setupAssist();
  try {
    const r = await sample(msgs, {cache:false, onText: ({text}) => { chatLog[chatLog.length-1].content = text; const b = document.querySelectorAll('#chat .bub'); if (b.length) b[b.length-1].textContent = text; }});
    chatLog[chatLog.length-1].content = r.text;
  } catch(err){ chatLog[chatLog.length-1].content = err && err.code === 'rate_limited' ? 'Muitas perguntas seguidas. Tente de novo em alguns minutos.' : 'Não consegui responder agora. Tente de novo mais tarde ou fale com o seu gestor.'; if (err && err.code === 'not_granted') sample = null; }
  setupAssist();
});
document.addEventListener('click', async e => {
  const f = e.target.closest('[data-feito]'); if (f){ const i = f.dataset.feito; feitos[i] = !feitos[i]; try { localStorage.setItem(LSK, JSON.stringify(feitos)); } catch(err){} render(); return; }
  const c = e.target.closest('[data-copy]'); if (c){ const t = H.rotina[c.dataset.copy].texto; try { await navigator.clipboard.writeText(t); c.textContent = 'Copiado'; } catch(err){ c.textContent = 'Selecione e copie'; } }
});
render();
</script>
