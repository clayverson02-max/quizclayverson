<title>Portal do Cliente</title>
<style>
:root{--bg:#f4f5f9;--panel:#fff;--panel2:#eef0f6;--fg:#161a26;--muted:#5d667c;--line:#dde1ea;--accent:#4f6bff;--ok:#1f9d63;--warn:#c98a10;--bad:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#171b2c;--panel2:#1f2438;--fg:#eceff7;--muted:#9aa3bb;--line:#2a3048;--accent:#7b8cff;--ok:#2fbf7a;--warn:#f2c14e;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#171b2c;--panel2:#1f2438;--fg:#eceff7;--muted:#9aa3bb;--line:#2a3048;--accent:#7b8cff;--ok:#2fbf7a;--warn:#f2c14e;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:22px}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab[aria-current="true"]{color:var(--fg);border-color:var(--fg)}
.tab .d{width:10px;height:10px;border-radius:50%}
.tab .b{background:var(--warn);color:#1a1206;border-radius:999px;font-size:11px;padding:0 7px}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font-size:16px;margin:0 0 10px}
.note{color:var(--muted);font-size:13px;margin:4px 0}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;background:var(--panel2);white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg .from{font-weight:700;font-size:13px;display:block}
.msg .t{font-size:11px;opacity:.75;display:block;margin-top:3px}
.msg a{color:inherit}
form .row{display:flex;gap:8px;margin-top:8px;align-items:flex-end;flex-wrap:wrap}
textarea{flex:1 1 220px;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.tab:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.item h3{margin:0 0 4px;font-size:15px}
.item video,.item img{width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:10px;margin:6px 0}
.item pre{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px;font:inherit;max-height:260px;overflow:auto}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:6px}
.st.pendente{background:var(--warn);color:#1a1206}.st.aprovado{background:var(--ok);color:#fff}.st.ajuste{background:var(--bad);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.req{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
<div class="wrap">
  <header>
    <div><h1 id="nome">Seu portal</h1><p class="sub" id="sub">Peça demandas, converse com a equipe e aprove as entregas.</p></div>
    <span class="pill" id="plano">Carregando…</span>
  </header>
  <nav id="tabs" aria-label="Agentes da sua equipe"></nav>
  <div class="grid">
    <div class="card">
      <h2 id="chat-title">Conversa</h2>
      <p class="note" id="eta"></p>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form id="f">
        <div class="row">
          <textarea id="txt" rows="2" placeholder="Escreva o que você precisa…" aria-label="Mensagem"></textarea>
          <button class="btn ok" type="submit" id="send">Enviar</button>
        </div>
        <div class="row">
          <label class="btn" for="files" id="att-l" style="cursor:pointer">Anexar arquivos</label>
          <input type="file" id="files" multiple hidden accept="image/*,video/*,audio/*,.pdf,.txt">
          <span class="note" id="att"></span>
        </div>
      </form>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><h2>Entregas para você aprovar</h2><div id="ents"></div></div>
      <div class="card"><h2>Seus pedidos</h2><div id="reqs"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const ALL = {
  luna:{name:'Luna', role:'Conteúdo do Instagram', color:'#f28c28'},
  davi:{name:'Davi', role:'Copy e roteiros', color:'#ff6fa8'},
  bia:{name:'Bia', role:'Vídeos e criativos', color:'#2fbf7a'},
  rafa:{name:'Rafa', role:'Anúncios', color:'#6fa8ff'},
  nina:{name:'Nina', role:'Sites', color:'#e8b93f'}
};
const PLANOS = {essencial:'Plano Essencial', crescimento:'Plano Crescimento', completo:'Plano Completo'};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora = iso => { try { return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
const st = {cfg:null, tab:'todos', chat:[], ents:[], reqs:[], aj:''};
let db = null;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2600); }
function agents(){ return ((st.cfg && st.cfg.agents) || []).filter(a => ALL[a]); }
function proxima(){ const d = new Date(); const n = new Date(d); n.setMinutes(13,0,0); if (n <= d) n.setHours(n.getHours()+1); return n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function render(){
  const c = st.cfg;
  if (c){ $('nome').textContent = 'Olá, ' + (c.nome || 'cliente'); $('plano').textContent = PLANOS[c.plano] || c.plano || ''; document.title = 'Portal · ' + (c.nome || 'Cliente'); }
  else $('plano').textContent = 'Portal ainda não configurado';
  const pend = a => st.ents.filter(e => (e.status||'pendente') === 'pendente' && (a === 'todos' || e.agent === a)).length;
  const tabs = [['todos','Equipe toda','#93a0bd'], ...agents().map(a => [a, ALL[a].name, ALL[a].color])];
  $('tabs').innerHTML = tabs.map(([id,n,col]) => `<button class="tab" type="button" data-tab="${id}" aria-current="${st.tab===id}"><span class="d" style="background:${col}"></span>${esc(n)}${pend(id) ? `<span class="b">${pend(id)}</span>` : ''}</button>`).join('');
  const a = ALL[st.tab];
  $('chat-title').textContent = a ? 'Conversa com ' + a.name + ' · ' + a.role : 'Conversa com a equipe toda';
  $('eta').textContent = 'A equipe responde e entrega de hora em hora. Próxima rodada: ' + proxima() + '.';
  const msgs = st.chat.filter(m => st.tab === 'todos' ? true : m.agent === st.tab);
  const box = $('chat'); const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = msgs.length ? msgs.map(m => {
    const me = m.role === 'cliente'; const ag = ALL[m.from || m.agent];
    const att = (m.attachments||[]).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">📎 ${esc(x.name)}</a>`).join('<br>');
    return `<div class="msg ${me?'me':''}"><span class="from">${me ? 'Você' : esc(ag ? ag.name : 'Equipe')}${!me && st.tab==='todos' && ag ? '' : ''}</span>${esc(m.text)}${att ? '<br>' + att : ''}<span class="t">${esc(hora(m.at))}${me && m.pending ? ' · aguardando a equipe' : ''}</span></div>`;
  }).join('') : '<div class="empty">Nenhuma mensagem ainda. Conte o que você precisa: um vídeo, um post, um texto, um ajuste no site…</div>';
  if (atEnd || !render._d){ box.scrollTop = box.scrollHeight; render._d = 1; }
  const ents = st.ents.filter(e => st.tab === 'todos' || e.agent === st.tab);
  $('ents').innerHTML = ents.length ? ents.map(e => {
    const s = e.status || 'pendente'; const ag = ALL[e.agent];
    let media = '';
    if (e.kind === 'video' && e.url) media = `<video src="${esc(e.url)}" controls playsinline preload="metadata"></video>`;
    else if (e.kind === 'imagem' && e.url) media = `<img src="${esc(e.url)}" alt="${esc(e.title)}">`;
    else if (e.kind === 'site' && e.url) media = `<p><a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Abrir o site</a></p>`;
    if (e.text) media += `<pre>${esc(e.text)}</pre>`;
    const lab = {pendente:'esperando você', aprovado:'aprovado', ajuste:'ajuste pedido'}[s] || s;
    const aj = st.aj === e._id ? `<form data-ajf="${esc(e._id)}"><div class="row"><textarea rows="2" required placeholder="O que você quer mudar?" aria-label="O que mudar"></textarea><button class="btn ok" type="submit">Enviar ajuste</button></div></form>` : '';
    return `<div class="item"><h3>${esc(e.title || 'Entrega')}<span class="st ${esc(s)}">${esc(lab)}</span></h3>
      <span class="note">${esc(ag ? ag.name : '')}${e.variant ? ' · ' + esc(e.variant) : ''} · ${esc(hora(e.createdAt))}</span>
      ${e.notes ? `<p class="note">${esc(e.notes)}</p>` : ''}${media}
      <div class="actions">${s === 'pendente' ? `<button class="btn ok" data-ok="${esc(e._id)}">Aprovar</button><button class="btn" data-aj="${esc(e._id)}">Pedir ajuste</button>` : ''}${e.url || e.text ? `<button class="btn" data-dl="${esc(e._id)}">Baixar</button>` : ''}</div>${aj}</div>`;
  }).join('') : '<div class="empty">Nada para aprovar agora.</div>';
  const reqs = st.reqs.filter(r => st.tab === 'todos' || r.agent === st.tab).slice(0, 15);
  const sl = {aberto:'na fila', fazendo:'em produção', feito:'entregue', 'esperando dono':'em análise pela agência', 'esperando cliente':'esperando você'};
  $('reqs').innerHTML = reqs.length ? reqs.map(r => `<div class="req"><b>${esc((ALL[r.agent]||{}).name || 'Equipe')}</b> · ${esc(r.titulo)} <span class="note">— ${esc(sl[r.status] || r.status)} · ${esc(hora(r.at))}</span></div>`).join('') : '<div class="empty">Nenhum pedido ainda.</div>';
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]'); if (t){ st.tab = t.dataset.tab; st.aj = ''; render._d = 0; render(); return; }
  const ok = e.target.closest('[data-ok]');
  if (ok && db){ ok.disabled = true; try { await db.doc('entregas/' + ok.dataset.ok).update({status:'aprovado', decidedAt: new Date().toISOString()}); toast('Aprovado! Obrigado.'); } catch(err){ ok.disabled = false; toast('Não deu para salvar agora. Tente de novo.'); } return; }
  const aj = e.target.closest('[data-aj]'); if (aj){ st.aj = aj.dataset.aj; render(); const ta = document.querySelector('[data-ajf] textarea'); if (ta) ta.focus(); return; }
  const dl = e.target.closest('[data-dl]'); if (dl) baixar(dl.dataset.dl, dl);
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-ajf]'); if (!f) return; e.preventDefault();
  const txt = f.querySelector('textarea').value.trim(); if (!txt || !db) return;
  const ent = st.ents.find(x => x._id === f.dataset.ajf); if (!ent) return;
  const now = new Date().toISOString();
  try {
    await db.doc('entregas/' + ent._id).update({status:'ajuste', feedback: txt, decidedAt: now});
    await db.collection('pedidos').add({agent: ent.agent, titulo: 'Ajuste: ' + String(ent.title||'').slice(0,60), detalhe: txt, entregaId: ent._id, attachments: [], status:'aberto', at: now});
    await db.collection('chat').add({agent: ent.agent, role:'cliente', text: 'Pedi um ajuste em "' + (ent.title||'entrega') + '": ' + txt, pending: false, at: now});
    st.aj = ''; toast('Ajuste enviado para a equipe');
  } catch(err){ toast('Não deu para enviar agora. Tente de novo.'); }
});
async function baixar(id, btn){
  const e = st.ents.find(x => x._id === id); if (!e) return;
  const dl = await window.claude?.use?.('downloads') ?? null;
  if (!dl){ if (e.url) window.open(e.url, '_blank', 'noopener'); return; }
  const old = btn.textContent; btn.textContent = 'Preparando…'; btn.disabled = true;
  try {
    if (!e.url || e.kind === 'site' || e.kind === 'texto') await dl.save({filename: (e.title||'entrega') + '.txt', data: (e.kind === 'site' ? 'Link do site: ' + e.url + '\n\n' : '') + String(e.text||'')});
    else { const r = await fetch(e.url); if (!r.ok) throw new Error('fetch'); await dl.save({filename: e.filename || ((e.title||'entrega') + (e.kind === 'video' ? '.mp4' : '.jpg')), data: await r.blob()}); }
    toast('Arquivo salvo');
  } catch(err){ if (!(err && err.code === 'declined')) toast('Não foi possível baixar agora.'); }
  finally { btn.textContent = old; btn.disabled = false; }
}
$('files').addEventListener('change', () => { const n = ($('files').files||[]).length; $('att').textContent = n ? n + ' arquivo(s) pronto(s) para enviar' : ''; });
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const text = $('txt').value.trim(); const files = Array.from($('files').files || []);
  if ((!text && !files.length) || !db) { if (!db) toast('Entre na sua conta para conversar com a equipe.'); return; }
  $('send').disabled = true;
  const attachments = [];
  if (files.length){
    const assets = await window.claude?.use?.('assets') ?? null;
    if (!assets) toast('Envio de arquivos indisponível agora');
    else for (const f of files){ $('att').textContent = 'Enviando ' + f.name + '…'; try { const r = await assets.upload(f); attachments.push({url: r.url, assetId: r.id, name: f.name, type: f.type || r.contentType || ''}); } catch(e){ toast('Não deu para enviar ' + f.name); } }
  }
  try {
    await db.collection('chat').add({agent: st.tab, role:'cliente', text: text || '(arquivos enviados)', attachments, pending: true, at: new Date().toISOString()});
    $('txt').value = ''; $('files').value = ''; $('att').textContent = ''; toast('Recebido! A equipe responde até ' + proxima() + '.');
  } catch(e){ toast('Não deu para enviar agora. Tente de novo.'); }
  finally { $('send').disabled = false; }
});
$('txt').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); $('f').requestSubmit(); } });
render();
setInterval(render, 60000);
(async () => {
  db = await window.claude?.use?.('db') ?? null;
  if (!db){ $('sub').textContent = 'Entre na sua conta para ver o seu portal.'; return; }
  const on = (q, fn) => q.onSnapshot(fn, () => {});
  db.doc('config/cliente').onSnapshot(d => { st.cfg = d.exists ? d.data() : null; render(); }, () => {});
  on(db.collection('chat').orderBy('at','asc').limit(300), s => { st.chat = s.docs.map(d => d.data()); render(); });
  on(db.collection('entregas').orderBy('createdAt','desc').limit(60), s => { st.ents = s.docs.map(d => ({_id:d.id, ...d.data()})); render(); });
  on(db.collection('pedidos').orderBy('at','desc').limit(60), s => { st.reqs = s.docs.map(d => d.data()); render(); });
})();
})();
</script>
